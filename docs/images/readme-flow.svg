      <circle cx="982" cy="76" r="22" fill="#54806c"/>
      <path d="M972 76l7 7 14-15" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="970" y="125" fill="#26332e" font-size="18" font-weight="700">Avanza</text>
      <text x="970" y="151" fill="#66776e" font-size="13">Sigue el progreso y completa.</text>

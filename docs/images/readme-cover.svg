<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title description">
  <title id="title">Taskdle, organiza tareas con más calma</title>
  <desc id="description">Ilustración de Taskdle en tonos verdes suaves, junto a una vista de tareas con prioridades y fechas.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8faf8"/>
      <stop offset="1" stop-color="#e7eeea"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#26332e" flood-opacity=".12"/>
    </filter>
  </defs>
  <rect width="1200" height="380" rx="28" fill="url(#background)"/>
  <circle cx="1095" cy="28" r="152" fill="#dbe7e0"/>
  <circle cx="1125" cy="350" r="120" fill="#e1e9e4"/>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <rect x="70" y="58" width="48" height="48" rx="15" fill="#52796f"/>
    <rect x="81" y="82" width="7" height="14" rx="3.5" fill="#ffffff" fill-opacity=".58"/>
    <rect x="92" y="74" width="7" height="22" rx="3.5" fill="#ffffff" fill-opacity=".8"/>
    <rect x="103" y="65" width="7" height="31" rx="3.5" fill="#ffffff"/>
    <circle cx="106" cy="62" r="4" fill="#ffffff"/>
    <path d="M104 62l1.5 1.5 3-3.5" fill="none" stroke="#52796f" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>

    <text x="132" y="90" fill="#26332e" font-size="25" font-weight="700">TASKDLE</text>

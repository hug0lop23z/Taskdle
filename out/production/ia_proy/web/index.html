<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestor de Tareas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:        #0d0d1a;
    --surface:   #13132a;
    --surface2:  #1c1c3a;
    --surface3:  #252548;
    --primary:   #7c3aed;
    --primary-h: #9f67ff;
    --cyan:      #22d3ee;
    --success:   #10b981;
    --warning:   #f59e0b;
    --danger:    #ef4444;
    --text:      #e2e8f0;
    --muted:     #94a3b8;
    --border:    rgba(255,255,255,0.07);
    --glass:     rgba(255,255,255,0.04);
    --radius:    14px;
    --shadow:    0 8px 32px rgba(0,0,0,0.4);
  }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ── Scrollbar ── */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--surface3); border-radius: 99px; }

  /* ── Auth Page ─────────────────────────────────────────────── */
  #auth-page {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background:
      radial-gradient(ellipse 80% 60% at 20% 10%, rgba(124,58,237,0.2) 0%, transparent 60%),
      radial-gradient(ellipse 60% 50% at 80% 90%, rgba(34,211,238,0.15) 0%, transparent 55%),
      var(--bg);
    padding: 1rem;
  }

  .auth-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 2.5rem;
    width: 100%;
    max-width: 420px;
    box-shadow: var(--shadow), 0 0 0 1px rgba(124,58,237,0.1);
    animation: fadeUp 0.5s ease;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(24px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .auth-logo {
    text-align: center;
    margin-bottom: 2rem;
  }
  .auth-logo .logo-icon {
    font-size: 2.8rem;
    display: block;
    margin-bottom: .5rem;
    filter: drop-shadow(0 0 16px rgba(124,58,237,0.6));
  }
  .auth-logo h1 { font-size: 1.4rem; font-weight: 700; color: var(--text); }
  .auth-logo p  { font-size: .85rem; color: var(--muted); margin-top: .2rem; }

  .tab-bar {
    display: flex;
    background: var(--surface2);
    border-radius: 10px;
    padding: 4px;
    margin-bottom: 1.8rem;
    gap: 4px;
  }
  .tab-btn {
    flex: 1;
    padding: .55rem 0;
    border: none;
    border-radius: 8px;
    background: transparent;
    color: var(--muted);
    font-family: inherit;
    font-size: .9rem;
    font-weight: 500;
    cursor: pointer;
    transition: all .25s;
  }
  .tab-btn.active {
    background: var(--primary);
    color: #fff;
    box-shadow: 0 4px 14px rgba(124,58,237,0.4);
  }

  .form-group { margin-bottom: 1.1rem; }
  .form-group label { display: block; font-size: .82rem; font-weight: 500; color: var(--muted); margin-bottom: .45rem; }
  .form-group input {
    width: 100%;
    padding: .72rem 1rem;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-family: inherit;
    font-size: .95rem;
    outline: none;
    transition: border-color .2s, box-shadow .2s;
  }
  .form-group input:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(124,58,237,0.2);
  }
  .form-group input::placeholder { color: var(--muted); opacity: .7; }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: .5rem;
    padding: .72rem 1.4rem;
    border: none;
    border-radius: 10px;
    font-family: inherit;
    font-size: .95rem;
    font-weight: 600;
    cursor: pointer;
    transition: all .2s;
  }
  .btn-primary {
    background: linear-gradient(135deg, var(--primary), #9f3aed);
    color: #fff;
    width: 100%;
    box-shadow: 0 4px 20px rgba(124,58,237,0.35);
  }
  .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 24px rgba(124,58,237,0.5); }
  .btn-primary:active { transform: translateY(0); }
  .btn-primary:disabled { opacity: .6; cursor: not-allowed; transform: none; }

  .err-msg {
    background: rgba(239,68,68,.1);
    border: 1px solid rgba(239,68,68,.3);
    border-radius: 8px;
    padding: .65rem 1rem;
    font-size: .85rem;
    color: #fca5a5;
    margin-top: 1rem;
    display: none;
  }
  .err-msg.visible { display: block; }

  /* ── Dashboard ─────────────────────────────────────────────── */
  #dashboard-page { display: none; min-height: 100vh; flex-direction: column; }

  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 1rem 1.8rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
    backdrop-filter: blur(12px);
  }

  .header-left { display: flex; align-items: center; gap: .8rem; }
  .header-left .logo { font-size: 1.6rem; filter: drop-shadow(0 0 8px rgba(124,58,237,0.5)); }
  .header-left h2 { font-size: 1.1rem; font-weight: 700; }
  .header-left h2 span { color: var(--primary); }

  .user-badge {
    display: flex;
    align-items: center;
    gap: .6rem;
    background: var(--glass);
    border: 1px solid var(--border);
    border-radius: 99px;
    padding: .45rem .9rem;
  }
  .user-badge .avatar {
    width: 28px; height: 28px;
    background: linear-gradient(135deg, var(--primary), var(--cyan));
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: .75rem; font-weight: 700; color: #fff;
  }
  .user-badge .name { font-size: .88rem; font-weight: 500; }

  .btn-logout {
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: .45rem .9rem;
    color: var(--muted);
    font-family: inherit;
    font-size: .82rem;
    cursor: pointer;
    transition: all .2s;
    margin-left: .6rem;
  }
  .btn-logout:hover { border-color: var(--danger); color: var(--danger); }

  /* Stats bar */
  .stats-bar {
    display: flex;
    gap: .8rem;
    padding: 1.2rem 1.8rem;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    overflow-x: auto;
  }

  .stat-card {
    flex: 1;
    min-width: 110px;
    background: var(--glass);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: .8rem 1rem;
    text-align: center;
    transition: transform .2s;
  }
  .stat-card:hover { transform: translateY(-2px); }
  .stat-num { font-size: 1.6rem; font-weight: 700; line-height: 1; }
  .stat-label { font-size: .72rem; color: var(--muted); margin-top: .3rem; text-transform: uppercase; letter-spacing: .05em; }
  .stat-card.total .stat-num   { color: var(--cyan); }
  .stat-card.pendiente .stat-num { color: var(--warning); }
  .stat-card.progreso .stat-num  { color: var(--primary-h); }
  .stat-card.completada .stat-num{ color: var(--success); }
  .stat-card.vencida .stat-num   { color: var(--danger); }

  /* Main content */
  .main-content { padding: 1.5rem 1.8rem; flex: 1; }

  /* Filters */
  .filters {
    display: flex;
    align-items: center;
    gap: .6rem;
    margin-bottom: 1.4rem;
    flex-wrap: wrap;
  }
  .filter-label { font-size: .82rem; color: var(--muted); margin-right: .2rem; }
  .filter-btn {
    padding: .4rem .9rem;
    border-radius: 99px;
    border: 1px solid var(--border);
    background: var(--glass);
    color: var(--muted);
    font-family: inherit;
    font-size: .82rem;
    cursor: pointer;
    transition: all .2s;
  }
  .filter-btn:hover { border-color: var(--primary); color: var(--text); }
  .filter-btn.active {
    background: var(--primary);
    border-color: var(--primary);
    color: #fff;
    box-shadow: 0 2px 10px rgba(124,58,237,0.3);
  }

  /* Task grid */
  .task-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
    gap: 1rem;
  }

  .task-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1.1rem;
    display: flex;
    flex-direction: column;
    gap: .6rem;
    transition: transform .2s, box-shadow .2s;
    animation: fadeUp .3s ease;
    position: relative;
    overflow: hidden;
  }
  .task-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    border-radius: var(--radius) var(--radius) 0 0;
  }
  .task-card.alta::before    { background: linear-gradient(90deg, var(--danger), #f97316); }
  .task-card.media::before   { background: linear-gradient(90deg, var(--warning), #eab308); }
  .task-card.baja::before    { background: linear-gradient(90deg, var(--success), #34d399); }
  .task-card.vencida-card    { border-color: rgba(239,68,68,.3); }

  .task-card:hover { transform: translateY(-3px); box-shadow: 0 12px 30px rgba(0,0,0,0.35); }

  .task-header { display: flex; align-items: flex-start; justify-content: space-between; gap: .5rem; }
  .task-title {
    font-size: .97rem;
    font-weight: 600;
    color: var(--text);
    line-height: 1.35;
    flex: 1;
    word-break: break-word;
  }
  .task-title.completada-title { color: var(--muted); text-decoration: line-through; }

  .badge {
    padding: .22rem .6rem;
    border-radius: 99px;
    font-size: .72rem;
    font-weight: 600;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .badge-alta    { background: rgba(239,68,68,.2);  color: #fca5a5; }
  .badge-media   { background: rgba(245,158,11,.2); color: #fcd34d; }
  .badge-baja    { background: rgba(16,185,129,.2); color: #6ee7b7; }

  .task-desc {
    font-size: .82rem;
    color: var(--muted);
    line-height: 1.45;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .task-meta {
    font-size: .75rem;
    color: var(--muted);
    display: flex;
    flex-direction: column;
    gap: .2rem;
  }
  .task-meta .vencida-tag { color: var(--danger); font-weight: 600; }
  .task-meta .ok-tag { color: var(--success); }

  .task-footer {
    display: flex;
    align-items: center;
    gap: .5rem;
    margin-top: .2rem;
  }

  .state-select {
    flex: 1;
    padding: .38rem .6rem;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: inherit;
    font-size: .8rem;
    cursor: pointer;
    outline: none;
    transition: border-color .2s;
  }
  .state-select:focus { border-color: var(--primary); }
  .state-select.PENDIENTE  { color: var(--warning); }
  .state-select.EN_PROGRESO{ color: var(--primary-h); }
  .state-select.COMPLETADA { color: var(--success); }

  .btn-delete {
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 8px;
    width: 32px; height: 32px;
    display: flex; align-items: center; justify-content: center;
    color: var(--muted);
    cursor: pointer;
    transition: all .2s;
    font-size: .9rem;
    flex-shrink: 0;
  }
  .btn-delete:hover { border-color: var(--danger); color: var(--danger); background: rgba(239,68,68,.1); }

  /* Empty state */
  .empty-state {
    grid-column: 1 / -1;
    text-align: center;
    padding: 4rem 2rem;
    color: var(--muted);
  }
  .empty-state .empty-icon { font-size: 3.5rem; margin-bottom: 1rem; opacity: .5; }
  .empty-state p { font-size: 1rem; }

  /* FAB */
  .fab {
    position: fixed;
    bottom: 2rem;
    right: 2rem;
    width: 56px; height: 56px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--primary), #9f3aed);
    border: none;
    color: #fff;
    font-size: 1.5rem;
    cursor: pointer;
    box-shadow: 0 6px 24px rgba(124,58,237,0.5);
    transition: all .25s;
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 200;
  }
  .fab:hover { transform: scale(1.1) rotate(90deg); }
  #dashboard-page.active .fab { display: flex; }

  /* Modal */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.6);
    backdrop-filter: blur(6px);
    z-index: 300;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 1rem;
    animation: fadeIn .2s ease;
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  .modal-overlay.open { display: flex; }

  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 1.8rem;
    width: 100%;
    max-width: 460px;
    box-shadow: var(--shadow);
    animation: fadeUp .3s ease;
  }

  .modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 1.4rem;
  }
  .modal-header h3 { font-size: 1.05rem; font-weight: 700; }
  .btn-close {
    background: transparent;
    border: none;
    color: var(--muted);
    font-size: 1.3rem;
    cursor: pointer;
    width: 32px; height: 32px;
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    transition: all .2s;
  }
  .btn-close:hover { background: var(--surface2); color: var(--text); }

  .modal-form .form-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: .8rem;
  }
  .modal-form select {
    width: 100%;
    padding: .72rem 1rem;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-family: inherit;
    font-size: .95rem;
    outline: none;
    transition: border-color .2s;
    cursor: pointer;
  }
  .modal-form select:focus { border-color: var(--primary); }
  .modal-form select option { background: var(--surface2); }
  .modal-form textarea {
    resize: vertical;
    min-height: 80px;
  }
  .modal-actions { display: flex; gap: .7rem; margin-top: 1.4rem; }
  .btn-secondary {
    flex: 1;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--muted);
    font-family: inherit;
    font-size: .95rem;
    font-weight: 500;
    cursor: pointer;
    padding: .72rem;
    transition: all .2s;
  }
  .btn-secondary:hover { color: var(--text); border-color: var(--primary); }
  .btn-primary-modal {
    flex: 2;
    background: linear-gradient(135deg, var(--primary), #9f3aed);
    border: none;
    border-radius: 10px;
    color: #fff;
    font-family: inherit;
    font-size: .95rem;
    font-weight: 600;
    cursor: pointer;
    padding: .72rem;
    transition: all .2s;
    box-shadow: 0 4px 16px rgba(124,58,237,.35);
  }
  .btn-primary-modal:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(124,58,237,.5); }

  .fecha-row { display: none; }
  .fecha-row.visible { display: block; }

  /* Loading spinner */
  .spinner {
    width: 18px; height: 18px;
    border: 2px solid rgba(255,255,255,.3);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin .7s linear infinite;
    display: inline-block;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Toast notifications */
  .toast-container {
    position: fixed;
    bottom: 1.5rem;
    left: 50%;
    transform: translateX(-50%);
    z-index: 400;
    display: flex;
    flex-direction: column;
    gap: .5rem;
    align-items: center;
  }
  .toast {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: .7rem 1.2rem;
    font-size: .88rem;
    box-shadow: var(--shadow);
    animation: fadeUp .3s ease;
    white-space: nowrap;
  }
  .toast.success { border-color: rgba(16,185,129,.4); color: #6ee7b7; }
  .toast.error   { border-color: rgba(239,68,68,.4);  color: #fca5a5; }
</style>
</head>
<body>

<!-- ── Auth Page ─────────────────────────────────────────────── -->
<div id="auth-page">
  <div class="auth-card">
    <div class="auth-logo">
      <span class="logo-icon">✅</span>
      <h1>Gestor de Tareas</h1>
      <p>Organiza tu día, un paso a la vez</p>
    </div>

    <div class="tab-bar">
      <button class="tab-btn active" id="tab-login"    onclick="showTab('login')">Iniciar sesión</button>
      <button class="tab-btn"        id="tab-registro" onclick="showTab('registro')">Crear cuenta</button>
    </div>

    <!-- Login -->
    <div id="panel-login">
      <div class="form-group">
        <label for="l-user">Usuario</label>
        <input type="text" id="l-user" placeholder="tu_usuario" autocomplete="username">
      </div>
      <div class="form-group">
        <label for="l-pass">Contraseña</label>
        <input type="password" id="l-pass" placeholder="••••••••" autocomplete="current-password">
      </div>
      <button class="btn btn-primary" id="btn-login" onclick="doLogin()">
        <span id="login-label">Iniciar sesión</span>
      </button>
      <div class="err-msg" id="err-login"></div>
    </div>

    <!-- Registro -->
    <div id="panel-registro" style="display:none">
      <div class="form-group">
        <label for="r-user">Usuario (mín. 3 caracteres)</label>
        <input type="text" id="r-user" placeholder="nuevo_usuario" autocomplete="username">
      </div>
      <div class="form-group">
        <label for="r-pass">Contraseña (mín. 4 caracteres)</label>
        <input type="password" id="r-pass" placeholder="••••••••" autocomplete="new-password">
      </div>
      <div class="form-group">
        <label for="r-pass2">Confirmar contraseña</label>
        <input type="password" id="r-pass2" placeholder="••••••••" autocomplete="new-password">
      </div>
      <button class="btn btn-primary" id="btn-registro" onclick="doRegistro()">
        <span id="registro-label">Crear cuenta</span>
      </button>
      <div class="err-msg" id="err-registro"></div>
    </div>
  </div>
</div>

<!-- ── Dashboard ─────────────────────────────────────────────── -->
<div id="dashboard-page">
  <header>
    <div class="header-left">
      <span class="logo">✅</span>
      <h2>Gestor de <span>Tareas</span></h2>
    </div>
    <div style="display:flex;align-items:center;gap:.5rem">
      <div class="user-badge">
        <div class="avatar" id="user-avatar">U</div>
        <span class="name" id="user-name-label">Usuario</span>
      </div>
      <button class="btn-logout" onclick="doLogout()">↩ Salir</button>
    </div>
  </header>

  <div class="stats-bar">
    <div class="stat-card total">
      <div class="stat-num" id="stat-total">0</div>
      <div class="stat-label">Total</div>
    </div>
    <div class="stat-card pendiente">
      <div class="stat-num" id="stat-pend">0</div>
      <div class="stat-label">Pendientes</div>
    </div>
    <div class="stat-card progreso">
      <div class="stat-num" id="stat-prog">0</div>
      <div class="stat-label">En progreso</div>
    </div>
    <div class="stat-card completada">
      <div class="stat-num" id="stat-comp">0</div>
      <div class="stat-label">Completadas</div>
    </div>
    <div class="stat-card vencida">
      <div class="stat-num" id="stat-venc">0</div>
      <div class="stat-label">Vencidas</div>
    </div>
  </div>

  <div class="main-content">
    <div class="filters">
      <span class="filter-label">Filtrar:</span>
      <button class="filter-btn active" data-filter="ALL"         onclick="setFilter(this)">Todas</button>
      <button class="filter-btn"        data-filter="PENDIENTE"   onclick="setFilter(this)">Pendientes</button>
      <button class="filter-btn"        data-filter="EN_PROGRESO" onclick="setFilter(this)">En progreso</button>
      <button class="filter-btn"        data-filter="COMPLETADA"  onclick="setFilter(this)">Completadas</button>
      <button class="filter-btn"        data-filter="VENCIDA"     onclick="setFilter(this)">⚠ Vencidas</button>
    </div>
    <div class="task-grid" id="task-grid"></div>
  </div>

  <!-- FAB -->
  <button class="fab" id="fab-btn" onclick="openModal()" title="Nueva tarea">＋</button>
</div>

<!-- ── Modal Nueva Tarea ──────────────────────────────────────── -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <div class="modal-header">
      <h3>✨ Nueva Tarea</h3>
      <button class="btn-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-form">
      <div class="form-group">
        <label for="m-titulo">Título *</label>
        <input type="text" id="m-titulo" placeholder="¿Qué necesitas hacer?">
      </div>
      <div class="form-group">
        <label for="m-desc">Descripción</label>
        <textarea class="form-group input" id="m-desc"
          style="width:100%;padding:.72rem 1rem;background:var(--surface2);border:1px solid var(--border);
                 border-radius:10px;color:var(--text);font-family:inherit;font-size:.95rem;outline:none;"
          placeholder="Detalles adicionales..." rows="3"></textarea>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label for="m-tipo">Tipo</label>
          <select id="m-tipo" onchange="toggleFecha()">
            <option value="SIMPLE">🗒 Tarea simple</option>
            <option value="FECHA">📅 Con fecha límite</option>
          </select>
        </div>
        <div class="form-group">
          <label for="m-prio">Prioridad</label>
          <select id="m-prio">
            <option value="ALTA">🔴 Alta</option>
            <option value="MEDIA" selected>🟡 Media</option>
            <option value="BAJA">🟢 Baja</option>
          </select>
        </div>
      </div>
      <div class="form-group fecha-row" id="fecha-row">
        <label for="m-fecha">Fecha límite *</label>
        <input type="date" id="m-fecha">
      </div>
      <div class="err-msg" id="err-modal"></div>
      <div class="modal-actions">
        <button class="btn-secondary" onclick="closeModal()">Cancelar</button>
        <button class="btn-primary-modal" id="btn-crear" onclick="doCrearTarea()">Crear tarea</button>
      </div>
    </div>
  </div>
</div>

<!-- ── Toast container ───────────────────────────────────────── -->
<div class="toast-container" id="toast-container"></div>

<script>
// ── State ────────────────────────────────────────────────────
let currentUser = null;
let allTasks    = [];
let activeFilter = 'ALL';

// ── Auth ─────────────────────────────────────────────────────
function showTab(tab) {
  document.getElementById('panel-login').style.display    = tab === 'login'    ? '' : 'none';
  document.getElementById('panel-registro').style.display = tab === 'registro' ? '' : 'none';
  document.getElementById('tab-login').classList.toggle('active', tab === 'login');
  document.getElementById('tab-registro').classList.toggle('active', tab === 'registro');
  document.getElementById('err-login').classList.remove('visible');
  document.getElementById('err-registro').classList.remove('visible');
}

async function doLogin() {
  const user = document.getElementById('l-user').value.trim();
  const pass = document.getElementById('l-pass').value;
  if (!user || !pass) { showErr('err-login', 'Completa todos los campos'); return; }

  setBtnLoading('btn-login', 'login-label', true);
  try {
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ usuario: user, password: pass })
    });
    const data = await res.json();
    if (data.ok) {
      currentUser = data.usuario;
      enterDashboard();
    } else {
      showErr('err-login', data.mensaje || 'Error al iniciar sesión');
    }
  } catch (e) {
    showErr('err-login', 'Error de conexión con el servidor');
  }
  setBtnLoading('btn-login', 'login-label', false, 'Iniciar sesión');
}

async function doRegistro() {
  const user  = document.getElementById('r-user').value.trim();
  const pass  = document.getElementById('r-pass').value;
  const pass2 = document.getElementById('r-pass2').value;
  if (!user || !pass || !pass2) { showErr('err-registro', 'Completa todos los campos'); return; }
  if (pass !== pass2) { showErr('err-registro', 'Las contraseñas no coinciden'); return; }

  setBtnLoading('btn-registro', 'registro-label', true);
  try {
    const res = await fetch('/api/registro', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ usuario: user, password: pass })
    });
    const data = await res.json();
    if (data.ok) {
      currentUser = data.usuario;
      enterDashboard();
      toast('¡Cuenta creada! Bienvenido 🎉', 'success');
    } else {
      showErr('err-registro', data.mensaje || 'Error al registrar');
    }
  } catch (e) {
    showErr('err-registro', 'Error de conexión con el servidor');
  }
  setBtnLoading('btn-registro', 'registro-label', false, 'Crear cuenta');
}

function doLogout() {
  currentUser = null;
  allTasks = [];
  document.getElementById('auth-page').style.display = 'flex';
  document.getElementById('dashboard-page').style.display = 'none';
  document.getElementById('dashboard-page').classList.remove('active');
  document.getElementById('l-user').value = '';
  document.getElementById('l-pass').value = '';
  showTab('login');
}

// ── Dashboard ─────────────────────────────────────────────────
function enterDashboard() {
  document.getElementById('auth-page').style.display = 'none';
  document.getElementById('dashboard-page').style.display = 'flex';
  setTimeout(() => document.getElementById('dashboard-page').classList.add('active'), 10);
  document.getElementById('user-name-label').textContent = currentUser;
  document.getElementById('user-avatar').textContent = currentUser[0].toUpperCase();
  loadTareas();
}

async function loadTareas() {
  try {
    const res = await fetch(`/api/tareas?usuario=${encodeURIComponent(currentUser)}`);
    allTasks = await res.json();
    renderStats();
    renderTareas();
  } catch (e) {
    toast('Error al cargar las tareas', 'error');
  }
}

function setFilter(btn) {
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  activeFilter = btn.dataset.filter;
  renderTareas();
}

function renderStats() {
  const total = allTasks.length;
  const pend  = allTasks.filter(t => t.estado === 'PENDIENTE').length;
  const prog  = allTasks.filter(t => t.estado === 'EN_PROGRESO').length;
  const comp  = allTasks.filter(t => t.estado === 'COMPLETADA').length;
  const venc  = allTasks.filter(t => t.vencida).length;
  document.getElementById('stat-total').textContent = total;
  document.getElementById('stat-pend').textContent  = pend;
  document.getElementById('stat-prog').textContent  = prog;
  document.getElementById('stat-comp').textContent  = comp;
  document.getElementById('stat-venc').textContent  = venc;
}

function renderTareas() {
  const grid = document.getElementById('task-grid');
  let tasks = allTasks;
  if (activeFilter === 'VENCIDA') tasks = tasks.filter(t => t.vencida);
  else if (activeFilter !== 'ALL') tasks = tasks.filter(t => t.estado === activeFilter);

  if (tasks.length === 0) {
    const msg = activeFilter === 'ALL'
      ? 'Aún no tienes tareas. ¡Crea una con el botón ＋!'
      : 'No hay tareas para este filtro.';
    grid.innerHTML = `<div class="empty-state"><div class="empty-icon">📋</div><p>${msg}</p></div>`;
    return;
  }

  grid.innerHTML = tasks.map(t => taskCardHTML(t)).join('');
}

function taskCardHTML(t) {
  const prioClass = t.prioridad.toLowerCase();
  const prioBadge = { ALTA: 'badge-alta', MEDIA: 'badge-media', BAJA: 'badge-baja' }[t.prioridad] || 'badge-media';
  const titleClass = t.estado === 'COMPLETADA' ? 'completada-title' : '';
  const cardClass  = t.vencida ? 'vencida-card' : '';

  let metaInfo = `<span>🗓 Creada: ${t.fechaCreacion}</span>`;
  if (t.fechaLimite) {
    if (t.vencida) {
      metaInfo += `<span class="vencida-tag">⚠ Vencida hace ${Math.abs(t.diasRestantes)} día(s)</span>`;
    } else if (t.estado !== 'COMPLETADA') {
      const dias = t.diasRestantes;
      const tag  = dias === 0 ? '⚡ ¡Vence hoy!'
                 : dias === 1 ? '⚡ Vence mañana'
                 : dias <= 7  ? `⏰ ${dias} días restantes`
                 :              `📅 Límite: ${t.fechaLimite}`;
      metaInfo += `<span>${tag}</span>`;
    } else {
      metaInfo += `<span class="ok-tag">✔ Completada a tiempo</span>`;
    }
  }

  const stateLabel = { PENDIENTE: '⏳ Pendiente', EN_PROGRESO: '🔄 En progreso', COMPLETADA: '✅ Completada' };

  return `
  <div class="task-card ${prioClass} ${cardClass}" id="card-${t.id}">
    <div class="task-header">
      <div class="task-title ${titleClass}">${escHtml(t.titulo)}</div>
      <span class="badge ${prioBadge}">${t.prioridad}</span>
    </div>
    ${t.descripcion ? `<div class="task-desc">${escHtml(t.descripcion)}</div>` : ''}
    <div class="task-meta">${metaInfo}</div>
    <div class="task-footer">
      <select class="state-select ${t.estado}" id="sel-${t.id}"
        onchange="cambiarEstado(${t.id}, this.value, this)">
        <option value="PENDIENTE"   ${t.estado === 'PENDIENTE'   ? 'selected' : ''}>${stateLabel.PENDIENTE}</option>
        <option value="EN_PROGRESO" ${t.estado === 'EN_PROGRESO' ? 'selected' : ''}>${stateLabel.EN_PROGRESO}</option>
        <option value="COMPLETADA"  ${t.estado === 'COMPLETADA'  ? 'selected' : ''}>${stateLabel.COMPLETADA}</option>
      </select>
      <button class="btn-delete" onclick="eliminarTarea(${t.id})" title="Eliminar tarea">🗑</button>
    </div>
  </div>`;
}

// ── CRUD Actions ──────────────────────────────────────────────
async function cambiarEstado(id, estado, sel) {
  sel.className = `state-select ${estado}`;
  try {
    const res = await fetch(`/api/tareas/${id}/estado`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ usuario: currentUser, estado })
    });
    const data = await res.json();
    if (data.ok) {
      const t = allTasks.find(x => x.id === id);
      if (t) t.estado = estado;
      renderStats();
      renderTareas();
      toast('Estado actualizado ✓', 'success');
    }
  } catch (e) { toast('Error al actualizar', 'error'); }
}

async function eliminarTarea(id) {
  if (!confirm('¿Eliminar esta tarea? Esta acción no se puede deshacer.')) return;
  try {
    const res = await fetch(`/api/tareas/${id}?usuario=${encodeURIComponent(currentUser)}`, {
      method: 'DELETE'
    });
    const data = await res.json();
    if (data.ok) {
      allTasks = allTasks.filter(t => t.id !== id);
      renderStats();
      renderTareas();
      toast('Tarea eliminada', 'success');
    }
  } catch (e) { toast('Error al eliminar', 'error'); }
}

// ── Modal ─────────────────────────────────────────────────────
function openModal() {
  document.getElementById('modal-overlay').classList.add('open');
  document.getElementById('m-titulo').focus();
  document.getElementById('err-modal').classList.remove('visible');
}

function closeModal() {
  document.getElementById('modal-overlay').classList.remove('open');
  document.getElementById('m-titulo').value = '';
  document.getElementById('m-desc').value   = '';
  document.getElementById('m-tipo').value   = 'SIMPLE';
  document.getElementById('m-prio').value   = 'MEDIA';
  document.getElementById('m-fecha').value  = '';
  document.getElementById('fecha-row').classList.remove('visible');
}

function toggleFecha() {
  const tipo = document.getElementById('m-tipo').value;
  document.getElementById('fecha-row').classList.toggle('visible', tipo === 'FECHA');
}

async function doCrearTarea() {
  const titulo = document.getElementById('m-titulo').value.trim();
  const desc   = document.getElementById('m-desc').value.trim();
  const tipo   = document.getElementById('m-tipo').value;
  const prio   = document.getElementById('m-prio').value;
  const fecha  = document.getElementById('m-fecha').value;

  if (!titulo) { showErr('err-modal', 'El título es obligatorio'); return; }
  if (tipo === 'FECHA' && !fecha) { showErr('err-modal', 'Selecciona una fecha límite'); return; }

  const btn = document.getElementById('btn-crear');
  btn.disabled = true;
  btn.textContent = 'Guardando…';

  try {
    const body = { usuario: currentUser, tipo, titulo, descripcion: desc, prioridad: prio };
    if (tipo === 'FECHA') body.fechaLimite = fecha;

    const res = await fetch('/api/tareas', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    const data = await res.json();
    if (data.ok) {
      closeModal();
      await loadTareas();
      toast('Tarea creada ✓', 'success');
    } else {
      showErr('err-modal', data.mensaje || 'Error al crear');
    }
  } catch (e) {
    showErr('err-modal', 'Error de conexión');
  }
  btn.disabled = false;
  btn.textContent = 'Crear tarea';
}

// ── Utility ───────────────────────────────────────────────────
function showErr(id, msg) {
  const el = document.getElementById(id);
  el.textContent = msg;
  el.classList.add('visible');
}

function setBtnLoading(btnId, labelId, loading, resetText) {
  const btn   = document.getElementById(btnId);
  const label = document.getElementById(labelId);
  btn.disabled = loading;
  label.innerHTML = loading ? '<span class="spinner"></span>' : resetText;
}

function escHtml(s) {
  return (s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function toast(msg, type = 'success') {
  const c = document.getElementById('toast-container');
  const t = document.createElement('div');
  t.className = `toast ${type}`;
  t.textContent = msg;
  c.appendChild(t);
  setTimeout(() => t.remove(), 3000);
}

// ── Keyboard shortcuts ────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    if (document.getElementById('panel-login').style.display !== 'none'
        && document.getElementById('auth-page').style.display !== 'none') doLogin();
    else if (document.getElementById('panel-registro').style.display !== 'none'
             && document.getElementById('auth-page').style.display !== 'none') doRegistro();
  }
  if (e.key === 'Escape' && document.getElementById('modal-overlay').classList.contains('open')) closeModal();
});
</script>
</body>
</html>
